<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 多模态裂缝智能分割分析平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h1>DeepCrack <span>3D Studio</span></h1>
            </div>
            <div class="model-badge">
                <span class="pulse"></span> 巅峰版 U-Net (ResNet34) 已就绪
            </div>
        </header>

        <main class="dashboard">
            <div class="panel upload-panel glass-panel">
                <h2><i class="fa-solid fa-cloud-arrow-up"></i> 导入原始图像</h2>
                <p>将待分析的高程深度(Def)、细节特征(Det)或灰度图像拖拽至此。系统自动归一缩放为 1024×1024 尺寸输入流。</p>
                <div class="drop-zone" id="drop-zone">
                    <i class="fa-regular fa-image"></i>
                    <span class="drop-text">点击或拖拽文件到这里</span>
                    <input type="file" id="file-input" accept="image/*" hidden>
                </div>
                <div class="action-bar">
                    <button id="analyze-btn" class="btn primary" disabled>
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 开始 AI 智能分割
                    </button>
                    <button id="clear-btn" class="btn secondary">
                        <i class="fa-solid fa-trash-can"></i> 清除
                    </button>
                </div>
            </div>

            <div class="panel results-panel glass-panel">
                <h2><i class="fa-solid fa-chart-pie"></i> 分割分析报告</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <h3 id="damage-percent">0.00%</h3>
                        <p>表面损伤面积比</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="mask-area">0</h3>
                        <p>预测像素面积(Px²)</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="image-size">- x -</h3>
                        <p>原始映射解析度</p>
                    </div>
                </div>

                <div class="preview-container" id="preview-container">
                    <div class="empty-state" id="empty-state">
                        <i class="fa-solid fa-microscope"></i>
                        <p>等待模型接收张量进行推断</p>
                    </div>
                    
                    <div class="image-wrapper" id="image-wrapper" style="display: none;">
                        <img id="result-img" src="" alt="分割结果">
                        <div class="scan-line" id="scan-line"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p>张量网络混合运算中... (<span id="loading-text">ResNet-34 Feature Extraction</span>)</p>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
