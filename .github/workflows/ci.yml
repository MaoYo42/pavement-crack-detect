name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 || true
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Only install lightweight deps; skip torch (too heavy for CI)
          grep -v "^torch" requirements.txt | grep -v "^torchvision" | pip install -r /dev/stdin || true
      - name: Lint with flake8
        run: |
          flake8 app/ app_macos/ val/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ app_macos/ val/ --count --max-complexity=15 --max-line-length=127 --statistics
      - name: Syntax check
        run: |
          python -m compileall -f app/ app_macos/ tools/ -q
